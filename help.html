<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帮助 · Renkit</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #f6f7fb; background: radial-gradient(circle at 82% 5%, #351116, transparent 32rem), #090a0d; }
    main { width: min(1120px, calc(100% - 36px)); margin: auto; padding: clamp(34px, 7vw, 78px) 0; }
    header { margin-bottom: clamp(28px, 5vw, 48px); }
    .eyebrow { color: #ffd24a; font-weight: 800; letter-spacing: .09em; }
    h1 { margin: 10px 0 18px; font-size: clamp(4rem, 11vw, 8rem); line-height: .95; letter-spacing: -.06em; }
    header p { max-width: 680px; color: #a9afbd; font-size: 1.05rem; }
    .cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
    figure { display: flex; flex-direction: column; margin: 0; padding: clamp(18px, 4vw, 30px); border: 1px solid rgba(255,255,255,.12); border-radius: 22px; background: #15171d; box-shadow: 0 18px 55px rgba(0,0,0,.28); }
    img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; background: #fff; border-radius: 15px; }
    .qr { padding: 12px; }
    figcaption { margin-top: auto; padding-top: 16px; text-align: center; color: #ffd24a; font-weight: 800; font-size: clamp(.95rem, 2.4vw, 1.12rem); overflow-wrap: anywhere; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #ffd24a; outline-offset: 5px; }
    @media (max-width: 720px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: clamp(3.6rem, 20vw, 6rem); }
      header p { max-width: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">RENKIT · SUPPORT</div>
      <h1>帮助</h1>
      <p>扫描二维码打开联系页面，也可以在闲鱼关注 RenAmamiya 获取更多资讯。</p>
    </header>
    <section class="cards" aria-label="帮助与联系信息">
        <figure>
          <a href="https://link3.cc/renamamiya" rel="noopener">
            <img class="qr" src="assets/help/renamamiya-qr.png" alt="https://link3.cc/renamamiya 的二维码" width="820" height="820">
            <figcaption>https://link3.cc/renamamiya</figcaption>
          </a>
        </figure>
        <figure>
          <img src="assets/help/xianyu-renamamiya.jpg" alt="RenAmamiya 的闲鱼主页与买卖信用信息" width="1320" height="894">
          <figcaption>闲鱼关注我了解更多资讯</figcaption>
        </figure>
    </section>
  </main>
</body>
</html>
