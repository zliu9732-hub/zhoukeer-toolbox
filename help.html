<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>帮助 · Renkit</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #f4f2f5;
      background: #111118;
    }
    main {
      width: min(940px, calc(100% - 40px));
      padding: clamp(32px, 6vw, 64px) 0;
      text-align: center;
    }
    h1 {
      margin: 0 0 clamp(28px, 5vw, 48px);
      font-size: clamp(1.45rem, 3.4vw, 2.25rem);
      line-height: 1.35;
      color: #f4dce7;
    }
    .contacts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(32px, 8vw, 92px);
      align-items: start;
    }
    figure { margin: 0; min-width: 0; }
    .account {
      margin: 0 0 14px;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
      font-weight: 800;
      color: #f0e7ed;
    }
    .account strong { color: #22d8bc; }
    .image-frame {
      width: min(100%, 330px);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
      border: 3px solid #eee7eb;
      box-shadow: 0 16px 40px rgba(0, 0, 0, .3);
    }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .qr { padding: 8px; }
    figcaption {
      min-height: 2.8em;
      margin-top: 14px;
      color: #ddd8de;
      font-size: clamp(.95rem, 2vw, 1.08rem);
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    a { color: #ddd8de; text-decoration: none; }
    a:hover { color: #22d8bc; text-decoration: underline; }
    a:focus-visible { outline: 3px solid #22d8bc; outline-offset: 5px; }
    @media (max-width: 660px) {
      .contacts { grid-template-columns: 1fr; gap: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>一起为Linux游戏社区贡献一份力，帮助到你了欢迎来闲鱼支持我</h1>
    <section class="contacts" aria-label="帮助与联系信息">
      <figure>
        <p class="account"><strong>RenAmamiya</strong></p>
        <div class="image-frame">
          <img class="qr" src="assets/help/renamamiya-qr.png" alt="RenAmamiya 联系主页二维码" width="820" height="820">
        </div>
        <figcaption><a href="https://link3.cc/renamamiya" rel="noopener">https://link3.cc/renamamiya</a></figcaption>
      </figure>
      <figure>
        <p class="account">闲鱼账号：<strong>RenAmamiya</strong></p>
        <div class="image-frame">
          <img src="assets/help/xianyu-renamamiya.jpg" alt="RenAmamiya 的闲鱼主页与买卖信用信息" width="1320" height="894">
        </div>
        <figcaption>闲鱼关注我了解更多资讯</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
