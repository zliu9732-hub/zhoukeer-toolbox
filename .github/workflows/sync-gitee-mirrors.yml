name: Sync Gitee mirror assets

on:
  push:
    branches:
      - main
    paths:
      - scripts/sync_gitee_mirrors.sh
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync plugin and GE-Proton Gitee mirrors
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            bash scripts/sync_gitee_mirrors.sh --only-inputplumber
          else
            bash scripts/sync_gitee_mirrors.sh
          fi
