name: Sync GE-Proton Gitee mirror

on:
  # Gitee returns HTTP 423 for mirror-8. Resume scheduling after Gitee unlocks it.
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync latest GE-Proton to dedicated Gitee mirror
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash scripts/sync_gitee_mirrors.sh --only-ge-proton
