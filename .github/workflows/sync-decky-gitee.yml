name: Sync Renkit and Decky Gitee mirror

on:
  push:
    branches:
      - main
    paths:
      - VERSION
      - dist/SHA256SUMS
      - dist/renkit.tar.gz
      - dist/zhoukeer-toolbox.tar.gz
      - .github/workflows/sync-decky-gitee.yml
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Decky mirror files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/sync_decky_gitee.sh

      - name: Commit mirror updates
        run: |
          git config --global user.name "zhoukeer-toolbox[bot]"
          git config --global user.email "bot@users.noreply.github.com"
          git add decky-installer-cn
          if git diff --cached --quiet; then
            echo "No Decky mirror changes"
          else
            git commit -m "Sync Decky Loader mirror to latest"
          fi

      - name: Push GitHub
        run: git push origin main

      - name: Push Renkit release and Decky mirror to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN secret is missing"
            exit 1
          fi
          sync_dir="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse \
            "https://zliu9732-hub:${GITEE_TOKEN}@gitee.com/zliu9732-hub/zhoukeer-toolbox-v2.git" \
            "$sync_dir/repo"
          git -C "$sync_dir/repo" sparse-checkout set --no-cone \
            '/decky-installer-cn/' \
            '/VERSION' \
            '/dist/SHA256SUMS' \
            '/dist/renkit.tar.gz' \
            '/dist/zhoukeer-toolbox.tar.gz'
          git -C "$sync_dir/repo" config user.name "zhoukeer-toolbox[bot]"
          git -C "$sync_dir/repo" config user.email "bot@users.noreply.github.com"
          git -C "$sync_dir/repo" rm -r --ignore-unmatch \
            decky-installer-cn VERSION dist/SHA256SUMS \
            dist/renkit.tar.gz dist/zhoukeer-toolbox.tar.gz
          cp -a -- decky-installer-cn "$sync_dir/repo/"
          mkdir -p "$sync_dir/repo/dist"
          cp -- VERSION "$sync_dir/repo/VERSION"
          cp -- dist/SHA256SUMS dist/renkit.tar.gz dist/zhoukeer-toolbox.tar.gz \
            "$sync_dir/repo/dist/"
          git -C "$sync_dir/repo" add \
            decky-installer-cn VERSION dist/SHA256SUMS \
            dist/renkit.tar.gz dist/zhoukeer-toolbox.tar.gz
          if git -C "$sync_dir/repo" diff --cached --quiet; then
            echo "No Gitee Renkit or Decky mirror changes"
          else
            git -C "$sync_dir/repo" commit -m "Sync Renkit release and Decky Loader mirror"
            git -C "$sync_dir/repo" push origin main
          fi
