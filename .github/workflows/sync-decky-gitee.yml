name: Sync Decky Gitee mirror

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Sync Decky mirror files
        run: bash scripts/sync_decky_gitee.sh

      - name: Commit mirror updates
        run: |
          git config --global user.name "zhoukeer-toolbox[bot]"
          git config --global user.email "bot@users.noreply.github.com"
          git add decky-installer-cn
          if git diff --cached --quiet; then
            echo "No Decky mirror changes"
          else
            git commit -m "Sync Decky Loader mirror to latest"
          fi

      - name: Push GitHub
        run: git push origin main

      - name: Push Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN secret is missing"
            exit 1
          fi
          sync_dir="$(mktemp -d)"
          git clone --depth 1 --filter=blob:none --sparse \
            "https://zliu9732-hub:${GITEE_TOKEN}@gitee.com/zliu9732-hub/zhoukeer-toolbox-v2.git" \
            "$sync_dir/repo"
          git -C "$sync_dir/repo" sparse-checkout set decky-installer-cn
          git -C "$sync_dir/repo" config user.name "zhoukeer-toolbox[bot]"
          git -C "$sync_dir/repo" config user.email "bot@users.noreply.github.com"
          git -C "$sync_dir/repo" rm -r --ignore-unmatch decky-installer-cn
          cp -a -- decky-installer-cn "$sync_dir/repo/"
          git -C "$sync_dir/repo" add decky-installer-cn
          if git -C "$sync_dir/repo" diff --cached --quiet; then
            echo "No Gitee Decky mirror changes"
          else
            git -C "$sync_dir/repo" commit -m "Sync Decky Loader mirror to latest"
            git -C "$sync_dir/repo" push origin main
          fi
